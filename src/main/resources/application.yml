server:
  port: 8080
#  tomcat:
#    threads:
#      max: 200
#      min-spare: 10
#    uri-encoding: UTF-8
#    connection-timeout: 60s
#    max-http-form-post-size: 10MB
#    max-swallow-size: 10MB


spring:
  application:
    name: health-social
#  profiles:
#    active: de
#  threads:
#    virtual:
#      enabled: false
#  autoconfigure:
#    exclude:
#      org.springframework.boot.autoconfigure.aop.AopAutoConfiguration
  cache:
    type: redis
    redis:
      key-prefix: ${spring.application.name}
      time-to-live: 600s
      cache-null-values: false

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/health_social?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&useSSL=false&allowMultiQueries=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 3000

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3s
      lettuce:
        pool:
          enabled: true
          max-active: 32
          max-idle: 16
          min-idle: 4

  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    connection-timeout: 3000
    # 生产者确认：点赞消息不允许丢
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # 手动 ACK：聚合落库成功才确认
        acknowledge-mode: manual
        prefetch: 500
        concurrency: 4
        max-concurrency: 8
        # 关闭 Spring 内置 retry，重试由 DLX + TTL 延迟队列自行控制
        retry:
          enabled: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.health.social.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id

logging:
  file:
    path: /data/logs/${spring.application.name}
  level:
    root: INFO
    com.health.social: INFO



# ===================== 业务参数 =====================
health:
  # ---------- 热点探测（HeavyKeeper） ----------
  hot:
    depth: 4          # 哈希行数 d
    width: 100000     # 每行桶数 w
    top-n: 100        # 热点榜单大小
    # 本地热点集合刷新周期（把 TopN 主动灌入 Caffeine，保证本地命中率）
    refresh-interval-ms: 30000
    # 访问量达到该阈值即视为热点，强制写入本地缓存
    local-cache-threshold: 5

  # ---------- 多级缓存 ----------
  cache:
    l1-max-size: 20000
    l1-ttl-seconds: 300      # Caffeine TTL 5 分钟
    l2-ttl-seconds: 600      # Redis TTL 10 分钟（带随机抖动）
    null-ttl-seconds: 120    # 空值缓存，防穿透
    lock-wait-ms: 3000
    lock-lease-ms: 5000

  # ---------- 点赞削峰 ----------
  like:
    batch-size: 500          # 每 500 条刷盘
    flush-interval-ms: 5000  # 或每 5 秒刷盘
    max-retry: 3             # 超过后进入死信队列
    retry-delay-ms: 10000    # 延迟重试队列 TTL
    # 全量回写：以 Redis 计数为准修正 DB 漂移（每小时）
    sync-cron: "0 15 * * * ?"

  # ---------- Feed 流 ----------
  feed:
    big-v-follower-threshold: 50000   # 粉丝数超过该值走拉模式 + 分桶
    bucket-ms: 21600000               # 大 V 时间分桶大小：6 小时
    inbox-max-size: 1000              # 收件箱裁剪上限
    pull-days: 7                      # 拉模式回溯天数
    default-page-size: 20

  # ---------- 限流 ----------
  ratelimit:
    normal-rate: 20        # 普通用户令牌生成速率（个/秒）
    normal-capacity: 40
    doctor-rate: 100       # 认证医生
    doctor-capacity: 200

  # ---------- 公益打赏 ----------
  debug-default-level: 0
  donate:
    foundation-base-url: http://127.0.0.1:9099/mock-foundation
    retry-limit: 5
    retry-fixed-delay-ms: 60000
    # T+1 日终对账：每天 02:30
    reconcile-cron: "0 30 2 * * ?"

  # ===================== 推荐模块（独立于推流模块） =====================
  # 说明：本模块的所有状态都在 rec:* 命名空间下，表也在独立的 rec_schema.sql 里，
  #       与 feed/like/donate 完全隔离；删除本段配置不会影响推流模块。
  recommend:
    # ---------- 召回 ----------
    recall-limit-per-channel: 200     # 单路召回上限（5 路 → 最多 1000 条候选）
    candidate-limit: 800              # 进入排序阶段的候选上限
    follow-recall-max-followees: 200  # 关注召回最多扫描多少个关注对象
    follow-recall-per-author: 20      # 关注召回每个作者取几条
    interest-recall-max-tags: 10      # 兴趣召回最多用几个兴趣标签
    interest-recall-per-tag: 100      # 兴趣召回每个标签取几条

    # ---------- 排序 ----------
    freshness-half-life-hours: 24     # 时间衰减半衰期（小时）
    interest-max-tags-per-article: 5  # 兴趣匹配时单篇最多参与几个标签
    weights:                          # 老用户权重档（各项特征已归一化到 0~1）
      hot: 0.28                       # 全局热度（曝光 + 点击对数归一）
      quality: 0.24                   # 内容质量（点赞率 Wilson 下界）
      fresh: 0.20                     # 新鲜度（指数衰减）
      interest: 0.14                  # 兴趣匹配
      follow: 0.06                    # 关注加成
      author: 0.04                    # 作者权威度（医生等级）
      channel: 0.04                   # 召回通道置信度
    cold-start-weights:               # 冷启动权重档（兴趣项归零，权重让给热点/新鲜）
      hot: 0.38
      quality: 0.20
      fresh: 0.28
      interest: 0.0
      follow: 0.06
      author: 0.04
      channel: 0.04

    # ---------- 打散 ----------
    max-per-author: 2                 # 一页内同一作者最多几条
    max-per-tag: 3                    # 一页内同一标签最多几条

    # ---------- 曝光去重 ----------
    exposure-window-size: 2000        # 在线曝光集合保留条数（滑动窗口）
    exposure-ttl-days: 30
    filter-liked: true                # 是否硬过滤已点赞内容（避免重复推荐用户已认可的内容）

    # ---------- 兴趣画像 ----------
    interest-cap: 10.0                # 兴趣分上限
    interest-boost-click: 0.3         # 点击一次的兴趣增量
    interest-boost-like: 1.0          # 点赞一次的兴趣增量
    interest-penalty-dislike: 2.0     # 不感兴趣的兴趣扣减
    interest-persist-min-tags: 5      # 回写 DB 时保留的兴趣标签数

    # ---------- 相似度（Item-CF / 标签 Jaccard） ----------
    sim-rebuild-article-limit: 2000   # 重建时处理的最近文章数
    sim-rebuild-group-cap: 100        # 同标签下参与两两比较的文章数上限
    sim-top-k: 50                     # 每篇保留的相似文章数
    sim-co-like-seed-limit: 50        # 单用户参与共现的最近点赞数
    sim-recall-per-seed: 30           # 相似召回每篇种子取几条
    sim-recall-max-seeds: 5           # 相似召回最多用几篇种子
    sim-rebuild-cron: "0 */10 * * * ?"    # 相似度重建：每 10 分钟

    # ---------- 候选池 ----------
    pool-max-size: 5000               # 候选池上限
    pool-reconcile-batch: 500         # 兜底扫描每批条数
    pool-reconcile-cron: "0 */2 * * * ?"  # 兜底扫描：每 2 分钟
    active-user-window-size: 5000     # 活跃用户榜容量
    interest-persist-cron: "0 */5 * * * ?" # 兴趣画像回写：每 5 分钟

    # ---------- 分页与落库 ----------
    default-page-size: 20
    max-page-size: 50
    flush-interval-ms: 5000           # 曝光/反馈缓冲刷盘间隔
    flush-batch-size: 500             # 单次刷盘最大条数
